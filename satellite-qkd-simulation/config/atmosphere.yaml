# ==========================================================
# ATMOSPHERIC MODEL CONFIGURATION
# ==========================================================

atmosphere:

  # --------------------------------------------------------
  # WAVELENGTH REFERENCE
  # --------------------------------------------------------
  wavelength: 8.0e-7        # [m] (800 nm, telecom/space QKD realistic)
  lambda_ref: 5.5e-7        # [m] reference wavelength

  # --------------------------------------------------------
  # RAYLEIGH SCATTERING
  # --------------------------------------------------------
  alpha_rayleigh_0: 5.0e-5  # [1/m] at lambda_ref

  # --------------------------------------------------------
  # AEROSOL (MIE)
  # --------------------------------------------------------
  alpha_aer_0: 3.0e-4       # [1/m] ground level
  angstrom_exponent: 1.3    # aerosol spectral slope
  H_aer: 1200               # [m] aerosol scale height

  # --------------------------------------------------------
  # ABSORPTION
  # --------------------------------------------------------
  alpha_humidity_0: 5.0e-5  # [1/m]
  alpha_ozone_0: 5.0e-6     # [1/m]

  humidity: 0.5             # relative humidity [0–1]
  optical_depth: 0.1
  # --------------------------------------------------------
  # NUMERICAL
  # --------------------------------------------------------
  n_steps: 200              # integration steps (slant path)
